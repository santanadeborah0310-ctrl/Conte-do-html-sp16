<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula05 - HTML</title>
    </head>
    <body>

        <h1>Utilizando o atributo syte para definir estilos em elementos HTML:</h1>

        <p style="color: orangered;">Eu sou laranja</p>

        <p style="color: saddlebrown">Eu sou marrom</p>

        <p style="font-size: 30px; font-weight: bold;">Eu estou destacado</p>

        <hr>

        <h3>Definindo cores de fundo com o atributo style no HTML:</h3>

        <h2 style="background-color: rgb(203, 71, 255)">Eu sou um h2</h2>
        <p style="background-color: crimson;">Eu sou um parágrafo</p>

    </body>
