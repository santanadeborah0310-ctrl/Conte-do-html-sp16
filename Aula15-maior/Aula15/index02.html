<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula15 - HTML</title>
  </head>
  <body>
    
    <h1>Caminhos de Arquivos no HTML</h1>

    <h3>Arquivo na pasta atual do HTML</h3>

    <img src="pintura.jpg" width="200" height="120">

    <hr>

    <h3>Arquivo em pasta no mesmo nível do HTML</h3>

    <img src="img/pintura.jpg" width="200" height="120">

    <hr>

    <h3>Arquivo em pasta na raíz do projeto/site</h3>

    <img src="/Aula15-img/pintura.jpg" width="200" height="120">

    <hr>

    <h3>Arquivo em pasta de nível maior</h3>

    <img src="/Aula15-maior/Aula15/img/pintura.jpg" width="200" height="120">

  </body>
</html>
