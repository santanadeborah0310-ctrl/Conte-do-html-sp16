<!DOCTYPE html>
<html lang="pt-br">
  <head>

    <title>Conteúdo Aula15 - HTML</title>
  
    <style>

      .ex1 {
        background-color: burlywood;
        border: none;
        width: 130px;
        height: 35px;
        font-family: monospace;
        font-weight: bold;
        color: darkolivegreen;
        cursor: pointer;
      }

      .ex1:hover {
        background-color: #c4a57d;
      }

    </style>

  </head>
  <body>
    
    <h1>Botões no HTML</h1>

    <h3>Estilizando botão</h3>

    <button class="ex1">Clique Aqui</button>

    <hr>

    <h3>Botão desativado</h3>

    <button disabled>Botão</button>

    <hr>

    <h3>Botão com JavaScript</h3>

    <button onclick="alert('Turma SP16');">Clique Aqui</button>

  </body>
</html>
