    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Conteúdo Ala16 - HTML</title>
    </head>
    <body>
        <h1>Formulário no HTML</h1>

        <form>
            <label for="pnome">Primeiro nome:</label><br>
            <input type="text" nome="pnome" id="pnome">
            <label for="">Segundo nome:</label>
            <input type="text" name="snome" id="snome"><br>
            <input type="button" value="Enviar">
        </form>

        <hr>

        <h3>Inputs tipo de radio</h3>

        <form>
            <input type="radio" nome="linguagem-favorita" id="op-html">
            <label for="op-html">HTML</label>
            <br>
            <input type="radio" name="linguagem-favorita" id="op-css">
            <label for="radio" name="linguagem-favorita" id="op-css">CSS</label>
            <br>
            <input type="radio" name="linguagem-favorita" id="op-js" value="JavaScript">
            <label for="op-js">JavaScript</label>
        </form>

        <hr>
        
        <h3>Inputs tipo checbox</h3>

        <form>
            <input type="checkbox" name="fruta1" id="f-morango" value="Morango">
            <label for="">Morango</label>
            <br>
            <input type="checkbox" name="fruta2" id="f-laranja" value="Laranja">
            <label for="f-laranja">Laranja</label>
            <br>
            <input type="checkbox" name="fruta3" id="f-maracuja" value="Maracuja">
            <label for="f-laranja">Maracuja</label>
            <br>
        </form>

        
    </body>
    </html>
