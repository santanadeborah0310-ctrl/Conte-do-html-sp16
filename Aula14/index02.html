<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula14 - HTML</title>
</head>
<body>

    <H1>JavaScript no HTML</H1>

    <h3>Alterando valores de atributos com JavaScript</h3>

    <img id="lamp-elemento" src="l-apagada.gif" alt="" width="100" height="180">

    <br>
    <button onclick="controlarLampada(1)">Acender*</button>
    <br>
    <button onclick="controlarLampada(0)">Apagar</button>

    <script>

        function controlarLampada(interruptor) {
            var imagem;
            if (interruptor == 0){
                imagem = "l-apagada.gif";
            } else {
                imagem = "l-acesa.gif";
            }

            document.getElementById("lamp-elemento").src = imagem;
        }

    </script>
    
</body>
</html>
